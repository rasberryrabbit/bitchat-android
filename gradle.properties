# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
android.useAndroidX=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.nonTransitiveRClass=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Public SHA-256 fingerprint of the certificate used by the existing GitHub
# universal APK releases. This is not a secret; it lets the app reject an APK
# signed by an unexpected publisher.
BITCHAT_GITHUB_RELEASE_CERT_SHA256=3b03fa66a5451321100792f5b55a7b4966d5c8dc10c6daa40aa95ea489531bca

# JVM heap size configuration to prevent OutOfMemoryError.
# Sandbox has ~4GB total RAM; keep the daemon heap modest and force sequential workers
# so D8 dexer and the Kotlin compiler never compete for memory at the same time.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8

# Limit parallel workers and disable parallel build to reduce peak memory.
org.gradle.parallel=false
org.gradle.workers.max=1

# Run the Kotlin compiler in the Gradle daemon JVM instead of forking a separate
# kotlin-compiler-daemon process (which can grow to >2GB RSS and OOM-kill the build).
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Point Gradle's toolchain auto-detection at the local JDK 21 (matches jvmToolchain(21)).
# The system only ships a JRE 21 (no javac); we use a portable Temurin JDK 21 instead.
org.gradle.java.installations.paths=/home/z/my-project/jdk/jdk-21
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
